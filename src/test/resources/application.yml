kestra:
  repository:
    type: memory
  queue:
    type: memory
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  server:
    liveness:
      enabled: false

kafka:
  bootstrap: localhost:9092
  registry: http://localhost:8085
  connect:
    url: http://localhost:8083
    # host-side path of the volume shared with the kafka-connect container's /data (see docker-compose-ci.yml)
    data-dir: build/connect-data

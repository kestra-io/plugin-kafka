# POC (do not merge): publish this plugin to a public Artifact Registry repository in the GCP sandbox
# project, to validate hosting plugins outside Maven Central. Runs on pushes to the POC branch only.
name: POC - Publish to sandbox Artifact Registry

on:
  push:
    branches:
      - poc/sandbox-artifact-registry

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout - Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - Build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true

      - name: GCP - Auth with github service account
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Publish - Sandbox Artifact Registry
        run: |
          VERSION="1.16.6-sandbox.${GITHUB_RUN_NUMBER}"
          ./gradlew publishAllPublicationsToKestraSandboxRepository -PsandboxPublish -Pversion="${VERSION}" --no-daemon
          {
            echo "### Published \`io.kestra.plugin:plugin-kafka:${VERSION}\`"
            echo
            echo "https://europe-west1-maven.pkg.dev/kestra-sandbox/kestra-plugins-public/io/kestra/plugin/plugin-kafka/${VERSION}/plugin-kafka-${VERSION}.jar"
          } >> "$GITHUB_STEP_SUMMARY"
